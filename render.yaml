# Render Blueprint — optional one-click backend for SAMP
# Pair with Vercel frontend (see docs/deployment-vercel.md)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: samp-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: STORAGE_BACKEND
        value: vercel_blob
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: samp-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: VERCEL_BLOB_TOKEN
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false

databases:
  - name: samp-db
    plan: free
    databaseName: samp
    user: samp
