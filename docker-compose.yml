services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: samp
      POSTGRES_PASSWORD: samp
      POSTGRES_DB: samp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samp -d samp"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to host by default (security)

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://samp:samp@db:5432/samp
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /data/storage
      CORS_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1
      COOKIE_SECURE: "false"
      ENVIRONMENT: production
    volumes:
      - evidence:/data/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ""
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  evidence:
